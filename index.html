<meta name="theme-color" content="#274B9F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="brand-gr" lang="el">μαζί</span>

    <div class="who" id="who" role="group" aria-label="Who is learning"></div>
  </header>
  <div class="meander" aria-hidden="true"></div>
  <main id="view" tabindex="-1"></main>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button type="button" data-tab="today"><span class="tab-gr" lang="el">Σήμερα</span><span>Today</span></button>
  <button type="button" data-tab="phrases"><span class="tab-gr" lang="el">Φράσεις</span><span>Phrases</span></button>

  <button type="button" data-tab="bible"><span class="tab-gr" lang="el">Βίβλος</span><span>Bible</span></button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/sync.js"></script>
